<html lang="en">

<head>
    <meta charset="utf-8">

    <link rel="stylesheet" href="style.css">
    <title>Practice with MSC</title>
    <link rel="stylesheet" href="../media.css">

</head>

<body>

    <!-- Navbar coding  -->
    <nav class="navbar  navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid ">
            <h2 class="navbar-brand">HaCoder</h2>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse " id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../about\about.html">About</a>
                    </li>
                    <li class="nav-item ">
                        <a class="nav-link " href="../Projects/project.html" role="button" aria-expanded="false">
                            My Projcets
                        </a>

                    </li>
                    <li class="nav-item">
                        <a class="nav-link " href="../Contact_me\contact.html" aria-disabled="true">Contact me</a>
                    </li>
                </ul>

            </div>
        </div>
    </nav>




    <section class="container-fluid main-div ">

        <div class="row ">
            <div id="info-div" class="col-lg-6 col-sm-12 col-12 text-center ">
                <h1 id="heading1">My <br>Portfolio</h1>
                <h5 id="heading5">A Frontend developer</h5>


                <br><br>
                <div class="btn-div text-start">
                    <p>I also works in C++ Basics, and Currently works on Backend Devenlopment</p>



                                 <!-- hire me button alert code -->

                    <div class="hireBtn text-center">

                        <button type="button" class="btn btn-outline-secondary mt-5 px-5 btnMain" data-bs-toggle="modal"
                            data-bs-target="#Modellaunch">HIRE ME</button>


                        <div class="modal" id="Modellaunch" tabindex="-1">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title">HireMe Form</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                            aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        <form action="hireMe form">


                                            <div class="input-group">
                                                <span class="input-group-text" id="visible-addon">@</span>
                                                <input type="text" class="form-control" placeholder="Username"
                                                    aria-label="Username" aria-describedby="visible-addon">
                                                <input type="text" class="form-control d-none"
                                                    placeholder="Hidden input" aria-label="Hidden input"
                                                    aria-describedby="visible-addon">
                                            </div>

                                            <br><br>

                                            <div class="input-group flex-nowrap ">
                                                <span class="input-group-text" id="addon-wrapping">Email</span>
                                                <input type="text" class="form-control" placeholder="xyz@gmail.com"
                                                    aria-label="Username" aria-describedby="addon-wrapping">
                                            </div>

                                            <br><br>

                                            <div class="input-group flex-nowrap ">
                                                <span class="input-group-text" id="addon-wrapping">Address</span>
                                                <input type="text" class="form-control"
                                                    placeholder="city, appartment, office no, etc" aria-label="Username"
                                                    aria-describedby="addon-wrapping">
                                            </div>
                                            <br><br><br>
                                            
                                        
                                        </form>

                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary"
                                            data-bs-dismiss="modal">Cancel</button>
                                        <button type="button" class="btn btn-primary ">Submit Form</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>


                </div>
            </div>


            <div id="pic-div" class="col-lg-6 col-sm-12 col-12 text-center bg-white">
                <img src="hacker.jpg" alt="" class="img-fluid rounded">
            </div>

        </div>

    </section>






    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
