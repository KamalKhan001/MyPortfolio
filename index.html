<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice with MSC</title>
    <link rel="stylesheet" href="port.css">
    <link rel="stylesheet" href="media.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container-fluid mt-5">
        <div class="container mt-5 ">
            <div class="row ">


                <div class="login mt-5 col-lg-6 col-12 shadow-lg py-5">


                    <!-- Heading title div -->

                    <div class="titleHeading text-center">
                        <h2>WELCOME TO MY PORTFOLIO</h2>
                    </div>



                      <!-- Username input tag -->

                    <div class=" mt-5 UserInput ">
                        <label for="formGroupExampleInput" class="form-label">Username : </label>
                        <input type="text" class="form-control "
                         id="userNameInput"
                            placeholder="Enter Username">
                    </div>



                          <!-- password input tag -->

                    <div class=" mt-4 passInput ">
                        <label for="formGroupExampleInput2" class="form-label">Password : </label>
                        <input type="password" class="form-control " id="userPasswordInput"
                            placeholder="Enter Password">
                    </div>




                    <br><br>

                          <!-- submit button div and tag -->

                    <div class="submitBtn text-center">
                        <button type="button" class="btn btn-outline-secondary py-2 px-4" id="subbtn">Log - in</button>
                    </div>


                </div>

                <div class="emty col-lg-6 col-12 ">

                </div>
            </div>
        </div>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="port.js"></script>
</body>

</html>
